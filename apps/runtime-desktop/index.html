<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智调鸿枢 · 协调中心</title>
<style>
    :root {
      --bg-base: #0c1017;
      --bg-panel: #131923;
      --bg-panel-hover: #18202d;
      --border-panel: rgba(255, 255, 255, 0.08);
      --border-panel-subtle: rgba(255, 255, 255, 0.04);
      --text-main: #f0f4f9;
      --text-sub: #8d9ba8;
      --text-dim: #546474;
      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.25);
      --accent-cyan: #06b6d4;
      --accent-cyan-glow: rgba(6, 182, 212, 0.28);
      --status-inactive: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-code: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      background-image:
        radial-gradient(ellipse 60% 40% at 50% 28%, rgba(29, 78, 216, 0.09) 0%, transparent 80%),
        radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0);
      background-size: 100% 100%, 32px 32px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    header {
      padding: 24px 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-panel-subtle);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 24px;
      height: 24px;
      color: var(--accent-blue);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-subtitle-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 2px 8px;
      border-radius: 4px;
      width: fit-content;
      margin-left: 34px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--text-sub);
      font-family: var(--font-code);
    }

    .state-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-panel);
    }

    .state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-inactive);
    }

    /* Main Console */
    main {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 36px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Central Power Unit */
    .hero-power-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      position: relative;
    }

    .power-btn-container {
      position: relative;
      width: 168px;
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer fine optical ring */
    .power-outer-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(59, 130, 246, 0.45);
      box-shadow: 0 0 24px rgba(59, 130, 246, 0.15), inset 0 0 16px rgba(59, 130, 246, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .power-outer-ring::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .power-button {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(59, 130, 246, 0.5);
      color: #93c5fd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.45),
        inset 0 2px 4px rgba(255, 255, 255, 0.12),
        inset 0 -4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .power-button:hover {
      transform: scale(1.02);
      border-color: #60a5fa;
      color: #bfdbfe;
      box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.55),
        0 0 20px rgba(59, 130, 246, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }

    .power-button:active {
      transform: scale(0.98);
    }

    .power-icon {
      width: 54px;
      height: 54px;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .unit-labels {
      text-align: center;
      margin-top: 18px;
    }

    .primary-action-text {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
    }

    .status-badge-row {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(100, 116, 139, 0.15);
      border: 1px solid rgba(100, 116, 139, 0.25);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .status-chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
    }

    /* Console Panels */
    .console-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 15px;
      height: 15px;
      color: var(--accent-blue);
    }

    .card-badge-info {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-code);
    }

    .network-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    select, input {
      width: 100%;
      background: #0d131c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: var(--font-code);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    select {
      cursor: pointer;
      appearance: none;
      padding-right: 32px;
    }

    select:focus, input:focus {
      border-color: var(--accent-blue);
    }

    .select-chevron {
      position: absolute;
      right: 12px;
      pointer-events: none;
      color: var(--text-dim);
      width: 14px;
      height: 14px;
    }

    input[readonly] {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-dim);
      cursor: not-allowed;
      border-style: dashed;
    }

    .network-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Sub Actions */
    .sub-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action-tile-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border-panel);
      background: #111722;
      color: var(--text-dim);
      cursor: not-allowed;
      transition: all 0.2s;
      user-select: none;
    }

    .action-tile-btn svg {
      width: 18px;
      height: 18px;
      opacity: 0.6;
    }

    .action-tile-btn:enabled {
      color: #67e8f9;
      border-color: #176d83;
      background: #102430;
      cursor: pointer;
    }
    .action-tile-btn:enabled:hover { background: #153343; }

    /* Collapsible Logs */
    .logs-panel {
      margin-top: 4px;
      border: 1px solid var(--border-panel);
      border-radius: var(--radius-md);
      background: #0f141d;
      overflow: hidden;
    }

    details summary {
      padding: 13px 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      list-style: none;
      background: var(--bg-panel);
    }

    details summary::-webkit-details-marker { display: none; }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-chevron {
      width: 14px;
      height: 14px;
      transition: transform 0.2s;
    }

    details[open] .summary-chevron {
      transform: rotate(90deg);
    }

    .log-terminal {
      padding: 14px 18px;
      font-family: var(--font-code);
      font-size: 12px;
      line-height: 1.7;
      color: #64748b;
      max-height: 110px;
      overflow-y: auto;
      border-top: 1px solid var(--border-panel-subtle);
      background: #0a0e14;
    }

    .log-item {
      display: flex;
      gap: 10px;
    }

    .log-time {
      color: #3b4d61;
      user-select: none;
    }

    /* Footer status */
    footer {
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      border-top: 1px solid var(--border-panel-subtle);
    }

    [hidden] { display: none !important; }
    body[data-state="RUNNING"] .power-button { color: #67e8f9; border-color: #22d3ee; box-shadow: 0 0 32px var(--accent-cyan-glow); }
    body[data-state="RUNNING"] .power-outer-ring { border-color: #22d3ee; box-shadow: 0 0 32px var(--accent-cyan-glow); }
    body[data-state="RUNNING"] .status-chip-dot { background: #22d3ee; }
    .power-button:disabled { cursor: wait; opacity: .65; }
    .error { color: #fda4af; margin: 10px 0; overflow-wrap: anywhere; }
    .log-terminal { white-space: pre-wrap; overflow-wrap: anywhere; }
    .advanced { margin-top: 12px; color: var(--text-sub); }
    .advanced summary { cursor: pointer; }
    .advanced label { display: block; margin-top: 10px; }
    a { color: #93c5fd; }
    .pair-dialog {
      width: min(760px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      padding: 0;
      border: 1px solid #176d83;
      border-radius: 16px;
      color: #e2e8f0;
      background: #121923;
    }
    .pair-dialog::backdrop { background: #050a12c9; backdrop-filter: blur(5px); }
    .pair-dialog h2 { margin: 0; padding: 14px 20px; background: #0b1119; font-size: 16px; }
    .pair-body { padding: 20px; }
    .pair-details { display: grid; grid-template-columns: minmax(0, 416px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .pair-qr { display: block; width: 100%; max-width: 416px; height: auto; aspect-ratio: 1; image-rendering: pixelated; background: white; border: 1px solid #176d83; border-radius: 8px; }
    .pair-details dl { display: grid; gap: 10px; margin: 0; }
    .pair-details dt { color: #94a3b8; font-size: 13px; }
    .pair-details dd { margin: 4px 0 0; padding: 8px; background: #0b1119; border-radius: 6px; overflow-wrap: anywhere; }
    .pair-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 16px; }
    @media (max-width: 680px) {
      .pair-body { padding: 12px; }
      .pair-details { grid-template-columns: minmax(0, 1fr); }
      .pair-qr { margin-inline: auto; }
    }
    @media (max-width: 560px) { .network-grid, .sub-actions-row { grid-template-columns: 1fr; } header { padding: 16px; } }
</style>
<script src="/desktop.js" defer></script>
</head>
<body data-page="center">
<header>
  <div class="brand">
    <h1 class="brand-title">智调鸿枢</h1>
    <span class="brand-subtitle-badge">协调中心</span>
  </div>
  <a id="role-link" href="/device" hidden>打开设备调度件</a>
</header>
<main style="max-width: 760px; padding: 32px 24px 28px;">
  <div class="hero-power-unit">
    <div class="power-btn-container">
      <div class="power-outer-ring"></div>
      <button class="power-button" id="power" type="button" aria-label="启动协调中心" disabled><svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg></button>
    </div>
    <div class="unit-labels">
      <h2 class="primary-action-text" id="power-title">启动协调中心</h2>
      <div class="status-badge-row">
        <span>服务状态</span>
        <span class="status-chip"><span class="status-chip-dot"></span><span id="status" role="status">正在读取状态</span></span>
      </div>
      <p class="network-hint" id="public-url" hidden></p>
      <p class="error" id="network-change" role="status" hidden></p>
      <p class="error" id="error" role="alert" hidden></p>
    </div>
  </div>
  <div class="console-stack">
    <section class="panel-card" aria-labelledby="network-title">
      <div class="card-header"><h2 class="card-title" id="network-title">网络接入配置</h2></div>
      <div class="network-grid">
        <div class="field-group">
          <label class="field-label" for="address">本机局域网地址</label>
          <div class="input-wrapper"><select id="address" disabled></select></div>
        </div>
        <div class="field-group">
          <label class="field-label" for="actual-port">服务端口</label>
          <div class="input-wrapper"><input id="actual-port" value="默认 7443" readonly></div>
        </div>
      </div>
      <p class="network-hint">局域网发现使用 UDP 7444。默认端口被占用时，可在高级设置中选择其他端口。</p>
      <details class="advanced">
        <summary>高级设置</summary>
        <label for="port">HTTPS 端口</label>
        <div class="input-wrapper"><input id="port" type="number" min="1" max="65535" value="7443"></div>
        <label for="center-suite">图像编码可信套件（可选）</label>
        <div class="input-wrapper"><input id="center-suite" placeholder="仅在需要图像编码时填写绝对路径"></div>
      </details>
    </section>
    <section class="panel-card"><div class="card-header"><h2 class="card-title">当前协作空间</h2></div><p id="workspace-name">启动中心后读取当前空间</p><div class="input-wrapper"><input id="workspace-name-input" maxlength="80" placeholder="新空间名称，例如：照片协同演示"></div><button class="action-tile-btn" id="create-workspace" disabled>创建并切换空间</button><p class="network-hint">每台设备同时只接入一个空间。新空间建好后，请重新为参与设备配对；历史任务保留。</p></section>
    <div class="sub-actions-row">
      <button class="action-tile-btn" type="button" id="dashboard" disabled>打开调度盘</button>
      <button class="action-tile-btn" type="button" id="devices" disabled>设备配对</button>
    </div>
    <button class="action-tile-btn" id="photo-display">打开真机任务展示（单机 / 协同）</button>
    <div class="logs-panel">
      <details><summary><span class="summary-left">运行日志</span></summary><pre class="log-terminal" id="logs">暂无运行日志</pre></details>
    </div>
  </div>
</main>
<dialog class="pair-dialog" id="pair-dialog" aria-labelledby="pair-title">
  <h2 id="pair-title">设备配对向导 · 安全通道连接</h2>
  <div class="pair-body">
    <p id="pair-status" role="status">正在生成配对二维码…</p>
    <p class="error" id="pair-error" role="alert" hidden></p>
    <div class="pair-details" id="pair-details" hidden>
      <img class="pair-qr" id="pair-qr" alt="有效期内原设备可重新接入的配对二维码">
      <dl>
        <div><dt>协调中心地址</dt><dd id="pair-address"></dd></div>
        <div><dt>6 位配对码（5 分钟内有效，兑换一次）</dt><dd id="pair-code" style="font-size:32px;letter-spacing:6px"></dd></div><div><dt>证书指纹（数字码首次连接时核对）</dt><dd id="pair-fingerprint"></dd></div><div><dt>协调端口</dt><dd id="pair-port"></dd></div>
        <div><dt>有效期至</dt><dd id="pair-expires"></dd></div>
      </dl>
    </div>
    <div class="pair-actions">
      <a id="pair-download" download="invitation.json" hidden>下载 Windows 设备邀请</a>
      <form method="dialog"><button type="submit" class="action-tile-btn">关闭</button></form>
    </div>
  </div>
</dialog>
</body>
</html>
