<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmony 调度系统</title>
<style>body{font:16px system-ui;background:#edf2f7;color:#14283f;max-width:1050px;margin:40px auto;padding:20px}section{background:white;padding:28px;border-radius:18px;margin:20px 0}button,a{padding:12px 20px;margin:8px 8px 8px 0;border:0;border-radius:8px;background:#1760bd;color:white;cursor:pointer;text-decoration:none;display:inline-block}input,select,textarea{font:inherit;padding:10px;max-width:95%;border:1px solid #b8c7d8;border-radius:6px}label{display:block;margin:12px 0}textarea{width:95%;height:100px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#14283f;color:#d6e7f9;padding:18px;max-height:280px;overflow:auto}.hint{color:#586b7d}button:disabled{opacity:.45;cursor:default}[hidden]{display:none}#error{color:#a12620}</style>
<h1>Harmony 调度系统</h1><p>启动协调中心，或将这台电脑作为执行设备接入。</p><p id="status" role="status">正在读取状态</p><p id="error" role="alert"></p>
<section><h2>协调中心</h2><label>局域网地址 <select id="address"></select></label><label>端口 <input id="port" type="number" value="7443" min="1" max="65535"></label><label>图像评测套件（可选） <input id="center-suite" size="55" placeholder="启用图像编码时选择与执行设备一致的可信套件"></label><button id="center">启动协调中心</button><a id="dashboard" hidden target="_blank" rel="noopener">打开调度盘</a><a id="devices" hidden target="_blank" rel="noopener">设备邀请与配对</a><p class="hint">首次访问需核对并信任公开证书。调度盘登录后显示真实设备资源、能力和任务；没有采集到的信息显示为未知。</p></section>
<section><h2>本机作为执行设备</h2><button id="discover">搜索附近的中心</button><p id="centers" class="hint">发现信息仅用于定位；首次加入需导入中心生成的邀请。</p><label>设备安装目录 <input id="directory" size="55" placeholder="留空使用用户目录下 HarmonyRuntime/device"></label><label>导入协调中心生成的完整设备邀请 <input id="file" type="file" accept=".json,application/json"></label><textarea id="invitation" placeholder="也可以粘贴完整设备邀请 JSON"></textarea><button id="pair">配对设备</button><label>图像后端 <select id="backend"><option value="">使用现有环境配置</option value="CPU">CPU</option><option value="CUDA">CUDA</option></select></label><label>Python 可执行文件 <input id="python" size="55" placeholder="启用图像编码时填写完整路径"></label><label>可信编码套件 JSON <input id="suite" size="55" placeholder="与协调中心一致的本地套件路径"></label><button id="agent">开启设备调度件</button><p class="hint">首次配对保存本机身份，后续直接开启。设备运行不代表能力就绪，请在中心调度盘核对校准状态。GPU 使用已有的模型与 Python 环境配置。</p></section>
<button id="stop" disabled>停止当前服务</button><p class="hint">停止期间等待进程退出；未结算任务保留恢复记录。关闭网页不会停止服务。</p><details><summary>运行日志</summary><pre id="logs"></pre></details>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('runtime-token')||'';if(location.hash)sessionStorage.setItem('runtime-token',token);history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id);
async function api(route,input){const r=await fetch(route,{method:input===undefined?'GET':'POST',headers:{'X-Runtime-Token':token,'Content-Type':'application/json'},body:input===undefined?undefined:JSON.stringify(input)});const data=await r.json();if(!r.ok)throw Error(data.error||'本机控制会话无效，请重新打开启动器');return data;}
async function act(route,input){$('error').textContent='';try{const result=await api(route,input);await refresh();return result;}catch(e){$('error').textContent=e.message;return null;}}
$('center').onclick=()=>act('/center/start',{address:$('address').value,port:$('port').value,suite:$('center-suite').value});
$('pair').onclick=()=>act('/agent/pair',{directory:$('directory').value,invitation:$('invitation').value}).then(result=>{if(result){$('invitation').value='';$('file').value='';$('directory').value=result.directory;}});
$('agent').onclick=()=>act('/agent/start',{directory:$('directory').value,backend:$('backend').value,python:$('python').value,suite:$('suite').value});$('stop').onclick=()=>act('/stop',{});
$('discover').onclick=async()=>{try{const d=await api('/discover');$('centers').textContent=d.centers.length?'发现中心：'+d.centers.join('，')+'。请从中心获取邀请确认加入。':'未发现中心，可直接导入邀请；检查 UDP 7444 或网络隔离。';}catch(e){$('error').textContent=e.message;}};
$('file').onchange=async()=>{const f=$('file').files[0];if(f){if(f.size>32768){$('error').textContent='邀请文件过大';return;}$('invitation').value=await f.text();}};
let refreshing=false;
async function refresh(){if(refreshing)return;refreshing=true;try{const s=await api('/state');const selected=$('address').value;
if(JSON.stringify(s.addresses)!==$('address').dataset.items){$('address').replaceChildren(...s.addresses.map(a=>new Option(a.name+' · '+a.address,a.address)));$('address').dataset.items=JSON.stringify(s.addresses);if(s.addresses.some(a=>a.address===selected))$('address').value=selected;}
$('status').textContent=({STOPPED:'已停止',STARTING:'正在启动',RUNNING:'服务运行中',STOPPING:'正在停止并结算',FAILED:'启动或运行失败，请查看日志'})[s.state];
const active=['STARTING','RUNNING','STOPPING'].includes(s.state);for(const id of ['center','agent','pair'])$(id).disabled=active;$('stop').disabled=!active||s.state==='STOPPING';
for(const [id,suffix] of [['dashboard','/dispatch.html'],['devices','/']]){$(id).hidden=!(s.state==='RUNNING'&&s.mode==='center');if(s.url)$(id).href=s.url+suffix;}
$('logs').textContent=s.logs.join('\n');}catch(e){$('error').textContent=e.message;}finally{refreshing=false;}}
refresh();$('discover').click();setInterval(refresh,2000);
</script></html>
