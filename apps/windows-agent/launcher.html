<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmony · 加入协作空间</title><style>body{margin:0;background:#f3f6fc;color:#182d4d;font:17px 'Segoe UI','Microsoft YaHei',sans-serif;display:grid;place-items:center;min-height:100vh}main{width:620px;background:white;padding:48px;border-radius:24px;box-shadow:0 20px 80px #172b4912}h1{font-size:36px}p{line-height:1.8;color:#667790}textarea{box-sizing:border-box;width:100%;min-height:140px;border:1px solid #cbd5e1;border-radius:12px;padding:16px;font:inherit}button{width:100%;margin-top:24px;padding:16px;background:#2457eb;color:white;border:0;border-radius:12px;font:inherit;cursor:pointer}#error{color:#b45309}</style><main><strong>HARMONY · 协作空间</strong><h1>输入加入码，连接团队。</h1><p>已连接过协调中心：输入负责人给出的 8 位加入码。首次连接：粘贴完整邀请链接。登录并确认共享后，本机自动启动代理。</p><form id="join"><label>加入码或邀请链接<textarea id="key" required spellcheck="false" placeholder="1234 5678 或完整邀请链接"></textarea></label><button>连接并加入</button><p id="error" role="alert"></p></form><button type="button" id="discover">搜索附近的协调中心</button><p id="centers"></p></main><script src="launcher.cjs"></script></html>
